institutions:
  - name: Universität Zürich, Deutsches Seminar
    courses:
      - sem: FS 2027
        title: "Akademische Textkompetenzen in Zeiten von LLMs (mit Elisabeth Zima)"
        format: Seminar
      - sem: HS 2026
        title: "Linguistik und Posthumanismus"
        format: MA-Seminar
        summary: |
          Posthumanistische Ansätze stellen zentrale Prämissen der Sprachwissenschaft infrage. Sie lösen Sprache aus der Vorstellung eines primär kognitiven, im Individuum lokalisierten Systems und begreifen sprachliches Handeln als relationales, materiell und medial eingebettetes Geschehen, das über Menschen, Körper, Artefakte, Technologien und Räume verteilt ist. Das Seminar führt in posthumanistische Perspektiven auf Sprache und Kommunikation ein, diskutiert Konzepte wie distributed cognition, spatial repertoires, languaging und semiotic assemblages und erprobt in einer Vertiefungsphase ihr analytisches Potenzial an exemplarischen Phänomenen. Gastvorträge von Miriam Lind (Frankfurt/Oder) und Britta Schneider (Wien).
        readings:
          - "Barad, Karen (2003): Posthumanist Performativity: Toward an Understanding of How Matter Comes to Matter. *Signs* 28(3), 801–831."
          - "Haraway, Donna (1991): A Cyborg Manifesto. In: *Simians, Cyborgs, and Women*. New York: Routledge, 149–181."
          - "Pennycook, Alastair (2018): Posthumanist Applied Linguistics. *Applied Linguistics* 39(4), 445–461."
          - "Pennycook, Alastair / Otsuji, Emi (2014): Metrolingual Multitasking and Spatial Repertoires. *Journal of Sociolinguistics* 18(2), 161–184."
          - "Mondada, Lorenza (2021): Orchestrating Multi-Sensoriality in Tasting Sessions. *Symbolic Interaction* 44(1), 63–86."
          - "Li Wei (2018): Translanguaging as a Practical Theory of Language. *Applied Linguistics* 39(1), 9–30."
          - "Schneider, Britta (2024): A Sociolinguist’s Look at the ‘Language’ in Large Language Models. *Critical AI* 2(1)."
          - "Bender, Emily M. et al. (2021): On the Dangers of Stochastic Parrots. *Proceedings of FAccT ’21*, 610–623."
      - sem: HS 2025
        title: "Historische Pragmatik"
        format: MA-Seminar
        summary: |
          Formen und Funktionen sprachlichen Handelns in deutschsprachigen Quellen vom 17. bis zum 21. Jahrhundert. Anhand von Briefen, Predigten, Prozessakten, Ratgebern und Theaterstücken analysieren wir Sprechakte, Höflichkeitsstrategien und diskursive Muster und fragen, wie sich kommunikative Praktiken historisch verändert haben. Methodologisch geht es darum, wie Mündlichkeit in schriftlichen Quellen rekonstruierbar ist, welche Herausforderungen historische Daten stellen und was grosse Sprachmodelle bei der Quellenanalyse leisten.
        readings:
          - "Jucker, Andreas H. (2018): Historische Pragmatik. In: Liedtke, Frank / Tuchen, Astrid (Hg.): *Handbuch Pragmatik*. Stuttgart: Metzler, 132–139."
          - "Linke, Angelika (2021): Musterwandel als Indikator für soziokulturellen Wandel. Grussformeln vom 17. zum 21. Jahrhundert. In: Weidner et al. (Hg.): *Verfestigungen in der Interaktion*. Berlin/Boston: De Gruyter, 131–157."
          - "Schröter, Juliane (2016): *Abschied nehmen. Veränderungen einer kommunikativen Kultur im 19. und 20. Jahrhundert*. Berlin/Boston: De Gruyter."
          - "Ackermann, Tanja (2023): Direktive Sprechakte in frühneuzeitlichen Fremdsprachenlehrwerken. *PBB* 145(1), 35–79."
          - "Nübling, Damaris et al. (2017): *Historische Sprachwissenschaft des Deutschen*. 5. Aufl. Tübingen: Narr, Kap. 7."
      - sem: FS 2025
        title: "Einführung Germanistische Linguistik B"
        format: Einführungskurs BA
        summary: |
          Das Modul verbindet eine Vorlesung zu den Paradigmen der Linguistik und zum Neuhochdeutschen, eine digitale Selbstlerneinheit mit den Grundbegriffen von Semantik, Pragmatik, Gesprächs-, Text- und Soziolinguistik sowie ein Begleitseminar. Im Seminar vertiefen und diskutieren wir die Inhalte an Studien und Quellen und üben linguistische Arbeitsweisen: Lesetechniken, Quellenkritik, Transkribieren, Analysemethoden. Das Modul habe ich zusammen mit Noah Bubenhofer neu konzipiert.
        readings:
          - "Hausendorf, Heiko / Kesselheim, Wolfgang (2008): *Textlinguistik fürs Examen*. Göttingen: Vandenhoeck & Ruprecht, 21–37."
          - "Janich, Nina (2008): Konversationsmaximen bei Bahndurchsagen. In: Crijns, Rogier / Thalheim, Janine (Hg.): *Kooperation und Effizienz in der Unternehmenskommunikation*. Wiesbaden: DUV, 85–102."
          - "Keim, Inken (2012): Zweisprachige Kommunikationspraktiken: Code-switching und Code-mixing. In: *Mehrsprachige Lebenswelten*. Tübingen: Narr, 144–175."
          - "Linke, Angelika (2001): Trauer, Öffentlichkeit und Intimität. Zum Wandel der Textsorte Todesanzeige."
          - "Knuchel, Daniel / Bubenhofer, Noah (2020): Korpuslinguistische Expeditionen als Anregung zur Reflexion über Sprachgebrauch. *Der Deutschunterricht* 6, 63–76."
          - "Knuchel, Daniel (2021): Diskurs-Latenz: Re-Aktivierungen von Stereotypen rund um HIV/AIDS in Onlineforen. In: Ilg et al. (Hg.): *Linguistik und Medizin*. Berlin/Boston: De Gruyter, 277–294."
      - sem: HS 2024
        title: "Züri brännt: die 1980er-Jugendunruhen aus kommunikationsgeschichtlicher Perspektive"
        format: MA-Seminar
        summary: |
          Ende Mai 1980 protestierten mehrere hundert Jugendliche vor dem Zürcher Opernhaus gegen die städtische Kulturpolitik; es folgten die Opernhauskrawalle und eine Bewegung, die sich über Demonstrationen, Graffiti, Comics, Videokunst und Flugblätter artikulierte. Das Seminar nähert sich diesem Quellenmaterial kommunikationsgeschichtlich: Ein erster Block erarbeitet Praxistheorie, Protestkommunikation und Multimodalität, ein zweiter erschliesst Bestände des Schweizerischen Sozialarchivs. Die Ergebnisse flossen in eine interaktive Stadtkarte ein.
        readings:
          - "Scharloth, Joachim (2011): *1968. Eine Kommunikationsgeschichte*. München: Fink."
          - "Linke, Angelika (2014): Kommunikationsgeschichte. In: Ágel, Vilmos / Gardt, Andreas (Hg.): *Paradigmen der aktuellen Sprachgeschichtsforschung*. Berlin/Boston: De Gruyter, 22–45."
          - "Deppermann, Arnulf / Feilke, Helmuth / Linke, Angelika (2016): Sprachliche und kommunikative Praktiken: eine Annäherung aus linguistischer Sicht. In: dies. (Hg.): *Sprachliche und kommunikative Praktiken*. Berlin: De Gruyter, 1–24."
          - "Linke, Angelika / Schröter, Juliane (2018): Diskurslinguistik und Transsemiotizität. In: Warnke, Ingo H. (Hg.): *Handbuch Diskurs*. Berlin/Boston: De Gruyter, 449–469."
          - "Scharloth, Joachim (2007): Performanz als Kategorie einer kulturanalytischen Linguistik. *Zeitschrift für Deutsche Philologie* 126, 390–410."
          - "Zutavern, Julia (2016): Züri brännt. In: *Nach Feierabend. Wissen ca. 1980* (= Zürcher Jahrbuch für Wissensgeschichte 12). Zürich: Diaphanes, 79–89."
      - sem: FS 2024
        title: "Kulturanalytische Linguistik"
        format: BA-Seminar
        summary: |
          Ausgangspunkt ist die Prämisse, dass Kultur und Gesellschaft ohne Sprache und Kommunikation nicht denkbar sind. Im Zentrum steht die Interdependenz von Sprache und Kultur: Über die Analyse kommunikativer Praktiken sollen Einsichten in kulturelle Besonderheiten und Veränderungen gewonnen werden, etwa an musterhaftem Sprachgebrauch von der Kompositabildung bis zur Textsorte, an kommunikativen Gattungen, Personenbezeichnungen und Alltagserzählungen. Ein erster Block entwickelt einen kommunikationstheoretisch fundierten Sprachbegriff (Praktiken, Dialogizität, Perspektivität) und einen methodischen Zugang über Form, Funktion und Musterhaftigkeit; ein zweiter diskutiert anhand von Beispielstudien und Gastvorträgen Identität und Beziehungskonstitution sowie Medialität und Digitalität. Abschluss mit Fallanalysen in Gruppen.
        readings:
          - "Günthner, Susanne / Linke, Angelika (2006): Linguistik und Kulturanalyse – Ansichten eines symbiotischen Verhältnisses. *Zeitschrift für Germanistische Linguistik* 34(1/2), 1–27."
          - "Schröter, Juliane / Tienken, Susanne / Ilg, Yvonne (2019): Linguistische Kulturanalyse. Eine Einführung. In: dies. et al. (Hg.): *Linguistische Kulturanalyse*. Berlin/Boston: De Gruyter, 1–27."
          - "Linke, Angelika (2016): Einführung: Kommunikation und Kulturalität. In: Jäger, Ludwig et al. (Hg.): *Sprache – Kultur – Kommunikation*. Berlin/Boston: De Gruyter, 351–368."
          - "Bubenhofer, Noah / Knuchel, Daniel / Schüller, Larissa (2022): Kulturlinguistik in der Schweiz – eine Einleitung. *Germanistik in der Schweiz* 18, 3–13."
      - sem: HS 2023
        title: "Sexualität(en) im Wandel: lexikalisch-semantische Perspektiven"
        format: Proseminar
        summary: |
          Wie über sexuelles Begehren, sexuelle Praktiken und Sexualpartner:innen gesprochen wird und wie Sexualorgane bezeichnet werden, ist historisch gebunden und unterliegt dem Wandel. Das Seminar nähert sich diesem Wandel vom 19. bis ins 21. Jahrhundert aus der Perspektive der historischen Semantik und Lexikologie. Ein erster Block erarbeitet den historisch-theoretischen Kontext (Sexualitätsgeschichte, Tabuisierung und Scham), ein zweiter die Werkzeuge der historischen Semantik, ein dritter wendet sie auf Ratgeber, Aufklärungstexte und Zeitschriften an. Die Studierenden realisieren ein eigenes kleines Forschungsprojekt und stellen es an einem Posterworkshop vor. Gastvorträge von Tony McEnery (Lancaster) und Crispin Thurlow (Bern).
        readings:
          - "Crespo-Fernández, Eliecer (2018): Taboos in speaking of sex and sexuality. In: Allan, Keith (Hg.): *The Oxford Handbook of Taboo Words and Language*. Oxford University Press, 40–60."
          - "Eder, Franz X. (2009): *Kultur der Begierde: eine Geschichte der Sexualität*. 2. Aufl. München: C.H. Beck, 9–28."
          - "Foucault, Michel (1986): *Sexualität und Wahrheit. Der Wille zum Wissen*. Frankfurt a. M.: Suhrkamp, 11–66."
          - "Nübling, Damaris (2017): Semantischer Wandel. In: Nübling et al.: *Historische Sprachwissenschaft des Deutschen*. Tübingen: Narr, 139–163."
          - "Sanyal, Mithu (2009): *Vulva: die Enthüllung des unsichtbaren Geschlechts*. Berlin: Wagenbach, 11–26."
          - "Siefkes, Martin (2015): Tabus in Diskursen aus kultursemiotischer Perspektive. *Kodikas/Code* 38(3–4), 203–226."
      - sem: FS 2023
        title: "Einführung Germanistische Linguistik B"
        format: Einführungskurs BA
      - sem: HS 2022
        title: "Sexualität(en) im Wandel: lexikalisch-semantische Perspektiven"
        format: Proseminar
        summary: |
          Erste Durchführung des Proseminars, hier mit kulturlinguistischem Schwerpunkt: Nach einem Block zu historischem und theoretischem Kontext führen Kleingruppen eigene Quellenanalysen durch (Ratgeber, Zeitschriften, Wörterbücher) und präsentieren sie als Poster an einem Abschlussworkshop. Mit einem Workshop der Kulturwissenschaftlerin Sarah Scheidmantel zur Entdeckung des Sexuellen um 1900.
        readings:
          - "Linke, Angelika (2018): Kulturhistorische Linguistik. In: Deppermann, Arnulf / Reineke, Silke (Hg.): *Sprache im kommunikativen, interaktiven und kulturellen Kontext*. Berlin/Boston: De Gruyter, 347–383."
          - "Crespo-Fernández, Eliecer (2018): Taboos in speaking of sex and sexuality. In: Allan, Keith (Hg.): *The Oxford Handbook of Taboo Words and Language*. Oxford University Press, 40–60."
          - "Köhnlein, Stephan (2001): Linguistische Ansätze zur Beschreibung und Erklärung des Phänomens «Sexuelles Sprachtabu». In: Hoberg, Rudolf (Hg.): *Sprache – Erotik – Sexualität*. Berlin: Erich Schmidt, 82–99."
          - "Schimpf, Silke (2001): Sprache im Bereich der Sexualität – Versuch einer Einordnung. In: Hoberg, Rudolf (Hg.): *Sprache – Erotik – Sexualität*. Berlin: Erich Schmidt, 62–81."
          - "Nübling, Damaris (2017): Semantischer Wandel. In: Nübling et al.: *Historische Sprachwissenschaft des Deutschen*. Tübingen: Narr, 139–163."
      - sem: FS 2022
        title: "Visuelle Linguistik: Sprache digital explorieren (Konzept, Co-Teaching mit Noah Bubenhofer)"
        format: MA-Seminar
        summary: |
          Wissen über Sprache und Kommunikation wird nicht nur schriftlich vermittelt und konstruiert, sondern massgeblich auch über Bilder, Grafiken, Diagramme, 3D-Modellierungen, Virtual und Augmented Reality. Wer kulturlinguistisch arbeitet, muss das Zusammenspiel dieser Codes ernst nehmen. Das Seminar legt sprach- und zeichentheoretische Grundlagen für eine visuelle Linguistik, diskutiert Multimodalität, Transsemiotizität und Diagrammatik und analysiert in Gruppenarbeiten einzelne Visualisierungsformen.
