  - name: Université de Genève, Département de langue et de littérature allemandes
    courses:
      - sem: FS 2026
        title: "Textkommunikation"
        format: Seminar
        summary: |
          Was macht einen Text aus? Welche Hinweise decodieren wir in der Lektüresituation, um etwas als «lesbares Etwas» wahrzunehmen, und wie sind Texte mit anderen Texten und mit der Welt vernetzt? Das Seminar nähert sich dem Text aus pragmatischer Richtung: Ein erster Teil diskutiert Textualität und Textualitätshinweise, ein zweiter vertieft das an Textfamilien und Textsorten aus Alltag, Schule und Politik, ein dritter erweitert die Perspektive auf digitale und multimodale Texte.
        readings:
          - "Hausendorf, Heiko / Kesselheim, Wolfgang / Kato, Hiloko / Breitholz, Martina (2017): *Textkommunikation. Ein textlinguistischer Neuansatz zur Theorie und Empirie der Kommunikation mit und durch Schrift*. Berlin/Boston: De Gruyter."
          - "Hausendorf, Heiko / Kesselheim, Wolfgang (2008): *Textlinguistik fürs Examen*. Göttingen: Vandenhoeck & Ruprecht."
          - "Fix, Ulla (2019): Text und Textlinguistik. In: Janich, Nina (Hg.): *Textlinguistik. 15 Einführungen und eine Diskussion*. 2. Aufl. Tübingen: Narr, 15–34."
          - "Adamzik, Kirsten (2016): *Textlinguistik: Grundlagen, Kontroversen, Perspektiven*. 2. Aufl. Berlin/Boston: De Gruyter."
          - "Hausendorf, Heiko (2009): Kleine Texte über Randerscheinungen von Textualität. *Germanistik in der Schweiz* 6, 5–19."
          - "Scharloth, Joachim (2023): Rituelle Wechselnichtigkeiten. Paraphrasenattribution als Methode der Identifikation von Textmustern auf Ansichtskarten. In: Hausendorf et al. (Hg.): *Ansichten zur Ansichtskarte*."
      - sem: FS 2026
        title: "Diskurslinguistik"
        format: Vorlesung
        summary: |
          Die Diskurslinguistik untersucht sprachliche Strukturen, Muster und Praktiken, die über einzelne Sätze und Texte hinausreichen: wie gesellschaftlich geteiltes Wissen, Deutungsmuster und soziale Wirklichkeiten sprachlich konstruiert und reproduziert werden. Die Vorlesung stellt theoretische und methodische Zugänge vor, von der qualitativen Analyse bis zu korpuslinguistischen Verfahren, und wendet sie auf Diskurse zu HIV/AIDS, Queerness, Klima, Migration und Künstlicher Intelligenz an.
        readings:
          - "Spitzmüller, Jürgen / Warnke, Ingo H. (2011): *Diskurslinguistik. Eine Einführung in Theorien und Methoden der transtextuellen Sprachanalyse*. Berlin/Boston: De Gruyter."
          - "Linke, Angelika / Schröter, Juliane (2018): Diskurslinguistik und Transsemiotizität. In: Warnke, Ingo H. (Hg.): *Handbuch Diskurs*. Berlin/Boston: De Gruyter, 449–469."
          - "Gardt, Andreas (2007): Diskursanalyse – Aktueller theoretischer Ort und methodische Möglichkeiten. In: Warnke, Ingo H. (Hg.): *Diskurslinguistik nach Foucault*. Berlin/New York: De Gruyter, 27–52."
          - "Dreesen, Philipp (2013): Sprechen-für-andere. Eine Annäherung an den Akteur und seine Stimmen mittels Footing und Polyphonie."
          - "Jacob, Katharina (2022): *Begriffe besetzen*."
          - "Stumpf, Sören (2025): Zur Verschränkung von Wortbildung und Diskurssemantik: Schlagwortkomposita in Verschwörungstheorien."
      - sem: HS 2025
        title: "Deutsche Sprachgeschichte"
        format: Vorlesung mit Übung
        summary: |
          Überblick über die Entwicklung der deutschen Sprache von den Anfängen bis ins 21. Jahrhundert mit Schwerpunkt auf dem Neuhochdeutschen. Neben Laut-, Wortschatz- und Grammatikwandel stehen kultur- und mediengeschichtliche Fragen im Zentrum: Wie hängen gesellschaftliche Umbrüche, neue Medien und Sprachgebrauch zusammen, welche Rolle spielen Normierung, Standardisierung und Sprachreflexion? Fallstudien zur Herausbildung der Schriftsprache, zum Sprachwandel im 19. und 20. Jahrhundert und zu aktuellen digitalen Entwicklungen.
        readings:
          - "Ernst, Peter (2021): *Deutsche Sprachgeschichte*. 3. Aufl. Wien: Facultas."
          - "Riecke, Jörg (2016): *Geschichte der deutschen Sprache. Eine Einführung*. Stuttgart: Reclam."
          - "Linke, Angelika (1996): *Sprachkultur und Bürgertum. Zur Mentalitätsgeschichte des 19. Jahrhunderts*. Stuttgart: Metzler."
      - sem: HS 2025
        title: "Helfende Interaktion"
        format: Seminar
        summary: |
          Helfen ist eine soziale und kommunikative Praxis, die in unterschiedlichsten Bereichen eine Rolle spielt. Das Seminar untersucht aus interaktionslinguistischer Perspektive, wie helfende Interaktionen sprachlich, medial und sozial ausgestaltet werden, in Face-to-Face-Situationen wie in digital-schriftlichen Formaten. Themen sind Machtasymmetrien, Beziehungsgestaltung und Rollenverteilung zwischen Hilfegebenden und Hilfesuchenden; analysiert werden Gespräche, Onlineforen und Briefkolumnen.
        readings:
          - "Pick, Ina / Scarvaglieri, Claudio (2019): Helfendes Handeln. Zur Konzeptualisierung einer linguistischen Beratungsforschung."
          - "Imo, Wolfgang / Lanwer, Jens Philipp (2019): *Interaktionale Linguistik. Eine Einführung*. Stuttgart: Metzler."
          - "Meer, Dorothee / Pick, Ina (2019): *Einführung in die Angewandte Linguistik. Gespräche, Texte, Medienformate analysieren*. Stuttgart: Metzler."
          - "Lamerichs, Joyce / Stommel, Wyke (2014): Interaction in online support groups: advice and beyond."
          - "Pick, Ina (2017): Anwaltliche Rechtsberatung."
          - "Scarvaglieri, Claudio (2019): Veränderung durch Verstehen in der Psychotherapie."
      - sem: FS 2025
        title: "Let’s talk about sex: linguistische Perspektiven auf einen tabuisierten Gegenstand"
        format: Seminar
        summary: |
          Wie wird über sexuelles Begehren und sexuelle Praktiken gesprochen, wie wird sexuelle Identität sprachlich konstruiert, und wie hat sich das verändert? Einführend fragen wir, was Sex und Sexualitäten sind, was sie mit Tabus zu tun haben und welche Rolle Sprache dabei spielt. Anhand von Studien nähern wir uns dem Gegenstand aus historischer Semantik und Interaktionslinguistik; im dritten Teil führen die Studierenden in Gruppen eigene kleine Forschungsprojekte durch.
        readings:
          - "Eder, Franz X. (2009): *Kultur der Begierde: eine Geschichte der Sexualität*. 2. Aufl. München: C.H. Beck, 9–28."
          - "Foucault, Michel (1986): *Sexualität und Wahrheit. Der Wille zum Wissen*. Frankfurt a. M.: Suhrkamp."
          - "Crespo-Fernández, Eliecer (2018): Taboos in speaking of sex and sexuality. In: Allan, Keith (Hg.): *The Oxford Handbook of Taboo Words and Language*. Oxford University Press, 40–60."
          - "Müller, Wolfgang (2001): Seid reinlich bei Tage und säuschi bei Nacht. In: Hoberg, Rudolf (Hg.): *Sprache – Erotik – Sexualität*. Berlin: Erich Schmidt, 11–61."
      - sem: FS 2025
        title: "Digitale Schreibkulturen"
        format: Seminar
        summary: |
          Die digitale Transformation verändert das Schreiben als kulturelle Praxis tiefgreifend: durch generative KI, die Schreiben in vielen Bereichen abnehmen kann, ebenso wie durch multimodale Textsorten wie TikTok-Videos und interaktive Praktiken wie das Kommentieren in Social Media. Das Seminar untersucht digitales Schreiben als kulturelle Praxis, Schreibprozesse wie Schreibprodukte, und verbindet Soziolinguistik, Medienlinguistik und Schreibforschung. Es ist an mein laufendes Forschungsprojekt angebunden und regt zu eigener Forschung an.
      - sem: HS 2024
        title: "Protestkommunikation gestern und heute"
        format: Seminar
        summary: |
          Protestieren ist in demokratischen Gesellschaften eine zentrale kommunikative und soziale Praxis. Das Seminar nähert sich ihr semiotisch-pragmatisch: Nach einem theoretischen Fundament zu Praxis, Materialität und Medialität untersuchen wir Generalstreik, 1968, die Zürcher Jugendunruhen 1980, die LGBTQIA+-Bewegung und die Klimastreiks und fragen nach den Medien und sprachlich-kommunikativen Mustern, die Protest nicht nur ausdrücken, sondern überhaupt erst hervorbringen.
        readings:
          - "Dang-Anh, Mark / Meer, Dorothee / Wyss, Eva Lia (Hg.) (2022): *Protest, Protestieren, Protestkommunikation*. Berlin/Boston: De Gruyter."
          - "Fahlenbrach, Kathrin / Klimke, Martin / Scharloth, Joachim (Hg.) (2016): *Protest Cultures: A Companion*. New York: Berghahn."
          - "Scharloth, Joachim (2011): *1968. Eine Kommunikationsgeschichte*. München: Fink."
      - sem: HS 2024
        title: "Korpuslinguistik"
        format: Vorlesung mit Übung
        summary: |
          Die empirische Arbeit mit grossen Textsammlungen ist aus der Sprachwissenschaft nicht mehr wegzudenken. Die Vorlesung führt in Grundlagen und Anwendungen der Korpuslinguistik ein, von Frequenz-, Kollokations-, Keyness- und Dispersionsanalysen bis zu ihrem Einsatz in Grammatik, Semantik, Pragmatik und Diskurslinguistik. Vorgestellt werden Ressourcen wie das Deutsche Referenzkorpus (DeReKo), das DWDS und die Corpus Workbench; im Übungsteil werden sie ausprobiert und eigene Analysen durchgeführt.
        readings:
          - "Perkuhn, Rainer / Keibel, Holger / Kupietz, Marc (2012): *Korpuslinguistik*. Paderborn: Fink."
          - "Gessinger, Joachim / Redder, Angelika / Schmitz, Ulrich (Hg.) (2018): *Korpuslinguistik* (= OBST 92). Duisburg: Universitätsverlag Rhein-Ruhr."
      - sem: FS 2024
        title: "Fakten aus linguistischer Sicht"
        format: Vorlesung
        summary: |
          Was sind (keine) Fakten, und was gilt aus welchen Gründen (nicht) als Faktum? Die Vorlesung stellt die Antworten der Linguistik vor, im Rahmen von Konstruktivismus und Diskursanalyse. Ein erster Block diskutiert Grundbegriffe wie Wahrheit, Wirklichkeit, Daten, Fakten und Wissen, ein zweiter epistemische Modalitäten und Muster der Wissens- und Nichtwissenskommunikation, ein dritter Verschwörungstheorien, das «Postfaktische» und «alternative Fakten» in aktuellen und historischen Diskursen.
      - sem: FS 2024
        title: "Angewandte Linguistik"
        format: Seminar
        summary: |
          Linguistik muss nicht abstrakt sein: Mit ihr lassen sich praktische Probleme in Sprache und Kommunikation beschreiben, erklären und lösen. Einführende Sitzungen stellen Felder wie Sprache und Medizin, Coaching, Corporate Communications, Wissenschaftskommunikation und Leichte Sprache vor. Im zweiten Teil bearbeiten die Studierenden Szenarien, die nach linguistischer Beratung verlangen: Problem identifizieren, wissenschaftlich fundierte Lösung entwickeln.
        readings:
          - "Knapp, Karlfried et al. (Hg.) (2011): *Angewandte Linguistik. Ein Lehrbuch*. 3. Aufl. Tübingen: Francke."
          - "Meer, Dorothee / Pick, Ina (2019): *Einführung in die Angewandte Linguistik. Gespräche, Texte, Medienformate analysieren*. Stuttgart: Metzler."
          - "Bock, Bettina M. / Pappert, Sandra (2022): *Leichte Sprache, Einfache Sprache, verständliche Sprache*. Tübingen: Narr."

